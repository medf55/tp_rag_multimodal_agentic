[project]
name = "tp-rag-multimodal-agentic"
version = "0.1.0"
description = "Application RAG multimodale et agentique (CLIP + ChromaDB + LangGraph ReAct)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pymupdf>=1.25.0",
    "pillow>=11.0.0",
    "matplotlib>=3.9.0",
    "torch>=2.5.0",
    "torchvision>=0.20.0",
    "open-clip-torch>=2.30.0",
    "chromadb>=1.0.0",
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain-text-splitters>=0.3.0",
    "langchain-google-genai>=2.1.0",
    "langchain-openai>=0.3.0",
    "langgraph>=0.3.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "python-dotenv>=1.0.0",
    "ipykernel>=6.29.0",
    "nbformat>=5.10.0",
    "nbclient>=0.10.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
]

[project.scripts]
multimodal-rag = "multimodal_rag.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/multimodal_rag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
